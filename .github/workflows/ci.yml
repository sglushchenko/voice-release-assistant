name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies from the lock file
        run: uv sync --frozen
      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests with coverage floor
        run: uv run pytest --cov

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f backend/Dockerfile -t voice-release-assistant:ci .
      - name: Smoke test the running container
        run: |
          docker run -d --name api -p 8000:8000 voice-release-assistant:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs api
          exit 1
