[project]
name = "release-assistant"
version = "0.1.0"
description = "Voice assistant backend for App Store Connect release management"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "limits>=5.8.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
release-assistant = "release_assistant.api.main:run"
release-assistant-hash-password = "release_assistant.api.main:hash_password"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_assistant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["release_assistant"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
